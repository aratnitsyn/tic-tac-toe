spring:
  application:
    name: api-gateway
server:
  port: ${PORT}
  shutdown: graceful
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
gateway:
  auth-url: ${AUTH_URL}
  auth-service-token: ${AUTH_SERVICE_TOKEN}
  web-origin: ${WEB_ORIGIN}
  game-url: ${GAME_URL}
  game-service-token: ${GAME_SERVICE_TOKEN}
