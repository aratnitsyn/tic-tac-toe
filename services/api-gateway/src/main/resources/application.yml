spring:
  application:
    name: api-gateway
server:
  port: ${PORT}
  shutdown: graceful
management:
  endpoints:
    web:
      exposure:
        include: ${MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE}
  endpoint:
    health:
      probes:
        enabled: true
gateway:
  auth-url: ${AUTH_URL}
  auth-service-token: ${AUTH_SERVICE_TOKEN}
  web-origin: ${WEB_ORIGIN}
  game-url: ${GAME_URL}
  game-service-token: ${GAME_SERVICE_TOKEN}
  lobby-url: ${LOBBY_URL}
  lobby-service-token: ${LOBBY_SERVICE_TOKEN}
  matchmaking-url: ${MATCHMAKING_URL}
  matchmaking-service-token: ${MATCHMAKING_SERVICE_TOKEN}
