spring:
  application:
    name: api-gateway
server:
  port: ${PORT:8080}
  shutdown: graceful
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
gateway:
  auth-url: ${AUTH_URL:http://127.0.0.1:8081}
  auth-service-token: ${AUTH_SERVICE_TOKEN}
  web-origin: ${WEB_ORIGIN:https://localhost}
