spring:
  application:
    name: game
  datasource:
    url: ${PG_JDBC_URL}
    username: ${PGUSER}
    password: ${PGPASSWORD}
  jackson:
    deserialization:
      fail-on-unknown-properties: true
server:
  port: ${PORT}
  shutdown: graceful
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
game:
  service-token: ${GAME_SERVICE_TOKEN}
events:
  url: ${NATS_URL}
  user: ${NATS_USER}
  password: ${NATS_PASSWORD}
coordination:
  retry-delay: ${COORDINATION_RETRY_DELAY_MS}
