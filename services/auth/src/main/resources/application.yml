spring:
  application:
    name: auth
  datasource:
    url: ${PG_JDBC_URL}
    username: ${PGUSER}
    password: ${PGPASSWORD}
    hikari:
      maximum-pool-size: 10
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}
  jackson:
    deserialization:
      fail-on-unknown-properties: true
server:
  port: ${PORT}
  shutdown: graceful
management:
  endpoints:
    web:
      exposure:
        include: ${MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE}
  endpoint:
    health:
      probes:
        enabled: true
auth:
  service-token: ${AUTH_SERVICE_TOKEN}
  login-key-file: ${AUTH_LOGIN_KEY_FILE}
  login-key-id: ${AUTH_LOGIN_KEY_ID}
  game-url: ${GAME_URL}
  game-service-token: ${GAME_SERVICE_TOKEN}
events:
  url: ${NATS_URL}
  user: ${NATS_USER}
  password: ${NATS_PASSWORD}
