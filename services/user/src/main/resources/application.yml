spring:
  application:
    name: user
  datasource:
    url: ${PG_JDBC_URL}
    username: ${PGUSER}
    password: ${PGPASSWORD}
server:
  port: ${PORT}
  shutdown: graceful
management:
  endpoints:
    web:
      exposure:
        include: ${MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE}
  endpoint:
    health:
      probes:
        enabled: true

events:
  url: ${NATS_URL}
  user: ${NATS_USER}
  password: ${NATS_PASSWORD}
