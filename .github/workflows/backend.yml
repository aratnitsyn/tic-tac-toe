name: Backend
on: [push, pull_request]
permissions:
  contents: read
jobs:
  script:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.19.0
      - run: python3 -m pip install -r infra/kubernetes/requirements.txt
      - run: python3 infra/kubernetes/tool/check.py
      - run: python3 -m unittest discover -s scripts/tests -v
      - run: python3 tools/contracts/check-structure.py
      - run: bash -n scripts/check-go.sh scripts/check-local.sh scripts/install-go-tools.sh
  kotlin:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [api-gateway, auth, user, lobby, game]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - name: Build and verify
        run: services/${{ matrix.service }}/gradlew -p services/${{ matrix.service }} clean build --no-daemon
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.0"
          cache: false
      - run: scripts/install-go-tools.sh
      - run: scripts/check-go.sh
