apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: {{ .Values.observation.namespace }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/config.yaml") . | sha256sum | quote }}
      labels:
        app: prometheus
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        fsGroup: 65534
      automountServiceAccountToken: false
      containers:
      - name: prometheus
        image: '{{ .Values.observation.prometheusImage }}'
        ports:
        - containerPort: 9090
          name: port-9090
        resources:
          requests:
            cpu: 25m
            memory: 64Mi
          limits:
            memory: 256Mi
        volumeMounts:
        - name: config
          mountPath: /etc/config
          readOnly: true
        - name: data
          mountPath: /data
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        args:
        - --config.file=/etc/config/prometheus.yaml
        - --storage.tsdb.path=/data
        - --storage.tsdb.retention.time=2h
        - --storage.tsdb.retention.size=256MB
        readinessProbe:
          httpGet:
            path: /-/ready
            port: 9090
          initialDelaySeconds: 5
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /-/ready
            port: 9090
          initialDelaySeconds: 30
          periodSeconds: 10
      volumes:
      - name: config
        configMap:
          name: prometheus
      - name: data
        persistentVolumeClaim:
          claimName: prometheus
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: {{ .Values.observation.namespace }}
spec:
  selector:
    app: prometheus
  ports:
  - name: http-9090
    port: 9090
    targetPort: 9090
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prometheus
  namespace: {{ .Values.observation.namespace }}
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: '{{ .Values.storageClassName }}'
  resources:
    requests:
      storage: 1Gi
