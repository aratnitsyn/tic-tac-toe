apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
  namespace: {{ .Values.observation.namespace }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: jaeger
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/config.yaml") . | sha256sum | quote }}
      labels:
        app: jaeger
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        fsGroup: 65534
      automountServiceAccountToken: false
      containers:
      - name: jaeger
        image: '{{ .Values.observation.jaegerImage }}'
        ports:
        - containerPort: 4318
          name: port-4318
        - containerPort: 16686
          name: port-16686
        resources:
          requests:
            cpu: 25m
            memory: 64Mi
          limits:
            memory: 256Mi
        volumeMounts:
        - name: config
          mountPath: /etc/config
          readOnly: true
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        args:
        - --config=/etc/config/jaeger.yaml
        readinessProbe:
          httpGet:
            path: /
            port: 16686
          initialDelaySeconds: 5
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /
            port: 16686
          initialDelaySeconds: 30
          periodSeconds: 10
      volumes:
      - name: config
        configMap:
          name: jaeger
---
apiVersion: v1
kind: Service
metadata:
  name: jaeger
  namespace: {{ .Values.observation.namespace }}
spec:
  selector:
    app: jaeger
  ports:
  - name: http-4318
    port: 4318
    targetPort: 4318
  - name: http-16686
    port: 16686
    targetPort: 16686
