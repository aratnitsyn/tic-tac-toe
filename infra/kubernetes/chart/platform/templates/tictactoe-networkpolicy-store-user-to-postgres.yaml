"apiVersion": "networking.k8s.io/v1"
"kind": "NetworkPolicy"
"metadata":
  "name": "store-user-to-postgres"
  "namespace": "{{ .Values.namespace }}"
"spec":
  "podSelector":
    "matchLabels":
      "app": "user"
  "policyTypes":
    - "Egress"
  "egress":
    -
      "to":
        -
          "namespaceSelector":
            "matchLabels":
              "kubernetes.io/metadata.name": "{{ .Values.dataNamespace }}"
          "podSelector":
            "matchLabels":
              "app": "postgres"
      "ports":
        -
          "protocol": "TCP"
          "port": 5432
