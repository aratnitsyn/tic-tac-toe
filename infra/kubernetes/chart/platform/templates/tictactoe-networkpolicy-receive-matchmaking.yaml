"apiVersion": "networking.k8s.io/v1"
"kind": "NetworkPolicy"
"metadata":
  "name": "receive-matchmaking"
  "namespace": "{{ .Values.namespace }}"
"spec":
  "podSelector":
    "matchLabels":
      "app": "matchmaking"
  "policyTypes":
    - "Ingress"
  "ingress":
    -
      "from":
        -
          "namespaceSelector":
            "matchLabels":
              "kubernetes.io/metadata.name": "{{ .Values.namespace }}"
          "podSelector":
            "matchLabels":
              "app": "api-gateway"
        -
          "namespaceSelector":
            "matchLabels":
              "kubernetes.io/metadata.name": "{{ .Values.namespace }}"
          "podSelector":
            "matchLabels":
              "app": "realtime"
        -
          "namespaceSelector":
            "matchLabels":
              "kubernetes.io/metadata.name": "{{ .Values.namespace }}"
          "podSelector":
            "matchLabels":
              "app": "realtime-dispatcher"
      "ports":
        -
          "protocol": "TCP"
          "port": 8085
