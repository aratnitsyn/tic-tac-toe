"apiVersion": "networking.k8s.io/v1"
"kind": "NetworkPolicy"
"metadata":
  "name": "send-api-gateway-to-matchmaking"
  "namespace": "{{ .Values.namespace }}"
"spec":
  "podSelector":
    "matchLabels":
      "app": "api-gateway"
  "policyTypes":
    - "Egress"
  "egress":
    -
      "to":
        -
          "namespaceSelector":
            "matchLabels":
              "kubernetes.io/metadata.name": "{{ .Values.namespace }}"
          "podSelector":
            "matchLabels":
              "app": "matchmaking"
      "ports":
        -
          "protocol": "TCP"
          "port": 8085
