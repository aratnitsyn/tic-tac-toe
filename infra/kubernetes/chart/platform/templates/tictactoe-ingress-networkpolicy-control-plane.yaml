"apiVersion": "networking.k8s.io/v1"
"kind": "NetworkPolicy"
"metadata":
  "name": "control-plane"
  "namespace": "{{ .Values.ingressNamespace }}"
"spec":
  "podSelector":
    "matchLabels": {}
  "policyTypes":
    - "Egress"
  "egress":
    -
      "to":
        -
          "namespaceSelector":
            "matchLabels":
              "kubernetes.io/metadata.name": "istio-system"
          "podSelector":
            "matchLabels":
              "app": "istiod"
      "ports":
        -
          "protocol": "TCP"
          "port": 15012
