"apiVersion": "networking.k8s.io/v1"
"kind": "NetworkPolicy"
"metadata":
  "name": "external-https"
  "namespace": "{{ .Values.ingressNamespace }}"
"spec":
  "podSelector":
    "matchLabels":
      "app": "ingress"
  "policyTypes":
    - "Ingress"
  "ingress":
    -
      "ports":
        -
          "protocol": "TCP"
          "port": 8443
