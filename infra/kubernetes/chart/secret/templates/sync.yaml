{{- $namespaces := list .Values.namespace .Values.dataNamespace .Values.ingressNamespace "tictactoe-vault" .Values.observation.namespace }}
{{- range $ns := $namespaces }}
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultConnection
metadata:
  name: vault
  namespace: {{ $ns }}
spec:
  address: https://vault.tictactoe-vault.svc.cluster.local:8200
  caCertSecretRef: vault-ca
  skipTLSVerify: false
{{- end }}
{{- range .Values.secret }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sync-{{ .name }}
  namespace: {{ .namespace }}
automountServiceAccountToken: false
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: {{ .name }}
  namespace: {{ .namespace }}
spec:
  vaultConnectionRef: vault
  method: kubernetes
  mount: kubernetes
  kubernetes:
    role: {{ .namespace }}-{{ .name }}
    serviceAccount: sync-{{ .name }}
    audiences: [vault]
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: {{ .name }}
  namespace: {{ .namespace }}
spec:
  vaultAuthRef: {{ .name }}
  mount: platform
  type: kv-v2
  path: {{ .namespace }}/{{ .name }}
  refreshAfter: 15s
  destination:
    name: {{ .name }}
    create: true
    overwrite: true
    type: {{ .type }}
    transformation:
      excludeRaw: true
  {{- if .restart }}
  rolloutRestartTargets:
    {{- toYaml .restart | nindent 4 }}
  {{- end }}
{{- end }}
