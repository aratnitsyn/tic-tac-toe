"apiVersion": "networking.istio.io/v1"
"kind": "DestinationRule"
"metadata":
  "name": "plaintext-auth"
  "namespace": "{{ .Values.namespace }}"
"spec":
  "host": "auth.{{ .Values.namespace }}.svc.cluster.local"
  "exportTo":
    - "*"
  "trafficPolicy":
    "connectionPool":
{{ toYaml .Values.mesh.connectionPool | indent 6 }}
    "tls":
      "mode": "DISABLE"
