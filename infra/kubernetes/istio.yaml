# Shared Helm values for Istio base/istiod 1.31.2; data-plane resources are in chart/mesh.
global:
  tag: 1.31.2
  proxy:
    resources:
      requests:
        cpu: 10m
        memory: 48Mi
      limits:
        memory: 192Mi
meshConfig:
  defaultConfig:
    holdApplicationUntilProxyStarts: true
    terminationDrainDuration: 10s
pilot:
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
